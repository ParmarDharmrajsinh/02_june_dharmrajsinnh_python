<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sign Up</title>

  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>

  <!-- Bootstrap CSS -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

  <!-- Google Fonts -->
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600&display=swap" rel="stylesheet">

  <style>
    body {
      font-family: 'Poppins', sans-serif;
    }
  </style>
</head>

<body class="bg-gradient-to-r from-pink-100 to-purple-200 min-h-screen d-flex align-items-center justify-content-center">

  <div class="container">
    <div class="row justify-content-center">
      <div class="col-lg-5 col-md-7 col-sm-10">
        <div class="bg-white shadow-lg rounded-3 p-5">
          <!-- Logo / Title -->
          <div class="text-center mb-4">
            <h2 class="text-2xl font-bold text-purple-600">Create Account</h2>
            <p class="text-gray-500">Join us and get started</p>
          </div>

          <!-- Signup Form -->
          <form method="post">
            {% csrf_token %}
            <!-- Full Name -->
            <div class="mb-3">
              <label class="form-label fw-semibold">Full Name</label>
              <input type="text" class="form-control rounded-pill p-3" name="name" placeholder="Enter your full name" required >
            </div>

            <!-- Email -->
            <div class="mb-3">
              <label class="form-label fw-semibold">Email Address</label>
              <input type="email" class="form-control rounded-pill p-3 " name="email" placeholder="Enter your email" required>
            </div>

            <!-- Password -->
            <div class="mb-3">
              <label class="form-label fw-semibold">Password</label>
              <input type="password" class="form-control rounded-pill p-3" name="password"placeholder="Enter password" required>
            </div>

            <!-- Confirm Password -->
            <div class="mb-3">
              <label class="form-label fw-semibold">Confirm Password</label>
              <input type="password" class="form-control rounded-pill p-3" name="confirmpassword" placeholder="Confirm password" required>
            </div>

            <!-- Terms -->
            <div class="d-flex align-items-center mb-4">
              <input type="checkbox" class="form-check-input me-2" id="terms" required>
              <label for="terms" class="form-check-label text-gray-600">
                I agree to the <a href="#" class="text-purple-600 fw-semibold hover:underline">Terms & Conditions</a>
              </label>
            </div>

            <!-- Submit Button -->
            <button type="submit" class="w-100 py-3 rounded-pill bg-purple-600 text-white fw-bold shadow hover:bg-purple-700 transition">
              Sign Up
            </button>
          </form>

          <!-- Divider -->
          <div class="d-flex align-items-center my-4">
            <hr class="flex-grow border-gray-300">
            <span class="px-2 text-gray-500">OR</span>
            <hr class="flex-grow border-gray-300">
          </div>

          <!-- Social Signup -->
          <div class="d-grid gap-2">
            <button class="btn btn-outline-dark rounded-pill py-2">
              <i class="bi bi-google me-2"></i> Sign up with Google
            </button>
            <button class="btn btn-outline-primary rounded-pill py-2">
              <i class="bi bi-facebook me-2"></i> Sign up with Facebook
            </button>
          </div>

          <!-- Login Link -->
          <p class="text-center mt-4 text-gray-600">
            Already have an account? 
            <a href="/" class="text-purple-600 fw-semibold hover:underline">Login</a>
          </p>
        </div>
      </div>
    </div>
  </div>

  <!-- Bootstrap JS -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <!-- Bootstrap Icons -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css">

</body>
</html>
