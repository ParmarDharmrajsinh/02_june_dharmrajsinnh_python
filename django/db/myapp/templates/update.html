<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Welcome</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>

<body class="bg-gradient-to-r from-blue-50 to-indigo-100 min-h-screen flex flex-col justify-center items-center">

  <!-- Header -->
  <header class="w-full text-center mb-10">
    <h1 class="text-4xl font-extrabold text-indigo-700 drop-shadow-md">Welcome to MyApp!</h1>
    <p class="text-gray-600 mt-2">Please fill out the form to continue.</p>
  </header>

  <!-- Form -->
  <div class="bg-white shadow-xl rounded-2xl p-8 w-full max-w-md">
    <form method="post" class="space-y-6">
      {% csrf_token %}
      <div class="space-y-4">
        {{ form.as_p }}
      </div>
      <button type="submit"
        class="w-full bg-indigo-600 text-white font-semibold py-3 px-4 rounded-xl hover:bg-indigo-700 transition-all">
        Submit
      </button>
    </form>
  </div>
  <a href="showdata/">showdata</a>

  <!-- Footer -->
  <footer class="mt-12 text-center text-gray-500 text-sm">
    &copy; 2025 MyApp. All rights reserved.
  </footer>

</body>

</html>
