{% extends 'base.html'%}
{% block title %}Profile{% endblock %}
{% block content %}


<section class="py-5">
  <div class="container">
    <h2 class="text-center mb-5">Your Profile</h2>

    <div class="row justify-content-center">
      <div class="col-md-6">
        <div class="card text-center">
          <img src="/static/2...png" class="card-img-top rounded-circle mx-auto mt-4" style="width:150px; height:150px;" alt="Profile Picture">
          <div class="card-body">
            <h4 class="card-title">Dharmaraj</h4>
            <p class="card-text">Traveler & Adventure Enthusiast</p>
            <ul class="list-group list-group-flush text-start">
              <li class="list-group-item"><strong>Email:</strong> profile@example.com</li>
              <li class="list-group-item"><strong>Phone:</strong> +91 9876543210</li>
              <li class="list-group-item"><strong>Location:</strong> India</li>
            </ul>
            <div class="mt-3">
              <a href="#" class="btn btn-primary">Edit Profile</a>
            </div>
          </div>
        </div>
      </div>
    </div>

  </div>
</section>

<!-- Bootstrap JS Bundle -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>


{% endblock %}
