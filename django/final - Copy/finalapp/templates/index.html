<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Welcome | NotesApp</title>
  <link rel="shortcut icon" href="/static/images/favicon.png" type="image/x-icon">
  <script src="https://cdn.tailwindcss.com"></script>
</head>

<body class="bg-gray-50 text-gray-800 antialiased">

  <!-- Navbar -->
  <nav class="bg-gray-900 text-white shadow-md sticky top-0 z-50">
    <div class="max-w-7xl mx-auto px-6 py-4 flex justify-between items-center">
      <a href="/" class="flex items-center gap-2">
        <img src="/static/Bokehlicia-Captiva-Checkbox.24.png" width="36" height="36" alt="logo"
          class="rounded-md shadow" />
        <span class="font-bold text-xl tracking-tight">NotesApp</span>
      </a>

      <div class="hidden md:flex items-center gap-6 text-sm font-medium">
        <a href="/" class="text-indigo-400 border-b-2 border-indigo-400 pb-1">Home</a>
        <a href="/about" class="hover:text-indigo-400">About</a>
        <a href="/contact" class="hover:text-indigo-400">Contact</a>
        <a href="/notes" class="hover:text-indigo-400">Notes</a>
      </div>

      <!-- User Section -->
      <div class="flex items-center gap-4">
        {% if user is none %}
        <div class="flex gap-3">
          <a href="/signin" class="bg-indigo-600 px-4 py-2 rounded-lg text-white hover:bg-indigo-500 transition">Signin</a>
          <a href="/signup" class="bg-yellow-500 px-4 py-2 rounded-lg text-white hover:bg-yellow-400 transition">Signup</a>
        </div>
        {% else %}
        <div class="relative group">
          <button
            class="bg-gray-800 px-4 py-2 rounded-lg flex items-center gap-2 hover:bg-gray-700 transition focus:outline-none">
            <span>{{user}}</span>
            <svg class="w-4 h-4 mt-1" fill="none" stroke="currentColor" stroke-width="2"
              viewBox="0 0 24 24">
              <path stroke-linecap="round" stroke-linejoin="round" d="M19 9l-7 7-7-7" />
            </svg>
          </button>
          <div
            class="absolute right-0 hidden group-hover:block bg-white text-gray-800 rounded-lg shadow-md mt-2 w-40 overflow-hidden">
            <a href="/update" class="block px-4 py-2 hover:bg-gray-100">Update Profile</a>
            <a href="/userlogout" class="block px-4 py-2 hover:bg-gray-100">Logout</a>
          </div>
        </div>
        {% endif %}
      </div>
    </div>
  </nav>

  <!-- Hero Section -->
  <section class="bg-gradient-to-r from-indigo-600 to-cyan-500 text-white py-20 text-center">
    <div class="max-w-4xl mx-auto px-4">
      <h1 class="text-4xl md:text-5xl font-extrabold mb-4">Welcome to NotesApp</h1>
      <p class="text-lg md:text-xl text-blue-100 max-w-2xl mx-auto">
        Create, organize, and manage your notes securely and easily — anytime, anywhere.
      </p>
      <div class="mt-6">
        <a href="/notes"
          class="bg-white text-indigo-700 px-6 py-3 rounded-lg font-semibold hover:bg-indigo-50 transition">
          Get Started
        </a>
      </div>
    </div>
  </section>

  <!-- Carousel Section -->
  <section class="max-w-6xl mx-auto px-4 py-10">
    <div class="relative rounded-2xl overflow-hidden shadow-lg">
      <div id="carouselExample" class="relative" data-carousel="static">
        <!-- Slides -->
        <div class="overflow-hidden relative h-[420px] rounded-2xl">
          <div class="duration-700 ease-in-out" data-carousel-item="active">
            <img src="/static/image.png" class="absolute block w-full h-full object-cover" alt="NotesApp Slide 1">
          </div>
          <div class="duration-700 ease-in-out hidden" data-carousel-item>
            <img src="/static/image1.png" class="absolute block w-full h-full object-cover" alt="NotesApp Slide 2">
          </div>
          <div class="duration-700 ease-in-out hidden" data-carousel-item>
            <img src="/static/image2.png" class="absolute block w-full h-full object-cover" alt="NotesApp Slide 3">
          </div>
        </div>

        <!-- Controls -->
        <button type="button"
          class="absolute top-0 left-0 z-30 flex items-center justify-center h-full px-4 cursor-pointer group focus:outline-none"
          data-carousel-prev>
          <span
            class="inline-flex items-center justify-center w-10 h-10 rounded-full bg-white/30 group-hover:bg-white/50">
            <svg aria-hidden="true" class="w-6 h-6 text-gray-800" fill="none" stroke="currentColor"
              stroke-width="2" viewBox="0 0 24 24">
              <path stroke-linecap="round" stroke-linejoin="round" d="M15 19l-7-7 7-7" />
            </svg>
          </span>
        </button>
        <button type="button"
          class="absolute top-0 right-0 z-30 flex items-center justify-center h-full px-4 cursor-pointer group focus:outline-none"
          data-carousel-next>
          <span
            class="inline-flex items-center justify-center w-10 h-10 rounded-full bg-white/30 group-hover:bg-white/50">
            <svg aria-hidden="true" class="w-6 h-6 text-gray-800" fill="none" stroke="currentColor"
              stroke-width="2" viewBox="0 0 24 24">
              <path stroke-linecap="round" stroke-linejoin="round" d="M9 5l7 7-7 7" />
            </svg>
          </span>
        </button>
      </div>
    </div>
  </section>

  <!-- Footer -->
  <footer class="bg-gray-900 text-gray-400 py-8 text-center">
    <p>&copy; <span id="year"></span> NotesApp — Built with ❤️ by the NotesApp Team</p>
  </footer>

  <script>
    document.getElementById('year').textContent = new Date().getFullYear();
  </script>

</body>

</html>
