<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Sign Up</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>

<body class="bg-gradient-to-r from-pink-100 via-purple-100 to-indigo-100 min-h-screen flex items-center justify-center">

  <div class="w-full max-w-md p-8 bg-white rounded-2xl shadow-2xl">
    <!-- Heading -->
    <h2 class="text-3xl font-bold text-center text-indigo-700 mb-6">Create Account</h2>
    <p class="text-center text-red-500 mb-8">{{msg}}</p>

    <!-- Form -->
    <form action="#" method="POST" class="space-y-6">
      {% csrf_token %}
      <!-- Full Name -->
      <div>
        <label for="name" class="block text-sm font-medium text-gray-600">Full Name</label>
        <input type="text" id="name" name="name" placeholder="John Doe" required
          class="w-full mt-2 px-4 py-3 border border-gray-300 rounded-xl focus:ring-2 focus:ring-indigo-400 focus:outline-none" />
      </div>

      <!-- Email -->
      <div>
        <label for="email" class="block text-sm font-medium text-gray-600">Email Address</label>
        <input type="email" id="email" name="email" placeholder="you@example.com" required
          class="w-full mt-2 px-4 py-3 border border-gray-300 rounded-xl focus:ring-2 focus:ring-indigo-400 focus:outline-none" />
      </div>

      <!-- Password -->
      <div>
        <label for="password" class="block text-sm font-medium text-gray-600">Password</label>
        <input type="password" id="password" name="password" placeholder="••••••••" required
          class="w-full mt-2 px-4 py-3 border border-gray-300 rounded-xl focus:ring-2 focus:ring-indigo-400 focus:outline-none" />
      </div>

      <!-- Confirm Password -->
      <div>
        <label for="confirm-password" class="block text-sm font-medium text-gray-600">Confirm Password</label>
        <input type="password" id="confirm-password" name="confirm-password" placeholder="••••••••" required
          class="w-full mt-2 px-4 py-3 border border-gray-300 rounded-xl focus:ring-2 focus:ring-indigo-400 focus:outline-none" />
      </div>

      <!-- Terms -->
      <div class="flex items-center gap-2 text-sm">
        <input type="checkbox" id="terms" required
          class="w-4 h-4 rounded border-gray-300 text-indigo-600 focus:ring-indigo-500" />
        <label for="terms" class="text-gray-600">
          I agree to the <a href="#" class="text-indigo-600 hover:underline">Terms & Conditions</a>
        </label>
      </div>

      <!-- Button -->
      <button type="submit"
        class="w-full py-3 mt-4 bg-indigo-600 text-white font-semibold rounded-xl shadow-md hover:bg-indigo-700 transition duration-300">
        Create Account
      </button>
    </form>

    <!-- Divider -->
    <div class="my-6 flex items-center">
      <hr class="flex-grow border-gray-300" />
      <span class="mx-3 text-gray-400 text-sm">OR</span>
      <hr class="flex-grow border-gray-300" />
    </div>

    <!-- Social Signup -->
    <div class="flex gap-4">
      <button
        class="flex-1 flex items-center justify-center gap-2 px-4 py-3 border rounded-xl hover:bg-gray-50 transition">
        <img src="https://www.svgrepo.com/show/355037/google.svg" alt="Google" class="w-5 h-5">
        Google
      </button>
      <button
        class="flex-1 flex items-center justify-center gap-2 px-4 py-3 border rounded-xl hover:bg-gray-50 transition">
        <img src="https://www.svgrepo.com/show/475647/facebook-color.svg" alt="Facebook" class="w-5 h-5">
        Facebook
      </button>
    </div>

    <!-- Login link -->
    <p class="mt-6 text-center text-sm text-gray-600">
      Already have an account?
      <a href="/signin" class="text-indigo-600 font-medium hover:underline">Sign in</a>
    </p>
  </div>

</body>

</html>
