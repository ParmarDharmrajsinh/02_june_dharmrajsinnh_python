<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>MediTrack — Sign Up</title>
  <link rel="stylesheet" href="style.css">
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600&display=swap" rel="stylesheet">
</head>
<body>
  <header class="site-header">
    <div class="container nav-container">
      <h1 class="brand">MediTrack</h1>
      <nav>
        <a href="index.html">Home</a>
        <a href="services.html">Services</a>
        <a href="about.html">About</a>
        <a href="contact">Contact</a>
        <a class="btn btn-signin" href="signin.html">Sign In</a>
      </nav>
    </div>
  </header>

  <main>
    <section class="container auth-section">
      <form class="auth-form" action="#" method="post">
        <h2>Create an account</h2>

        <label for="name">Full name</label>
        <input id="name" name="name" type="text" required>

        <label for="email">Email</label>
        <input id="email" name="email" type="email" required>

        <label for="password">Password</label>
        <input id="password" name="password" type="password" minlength="6" required>

        <label for="confirm">Confirm Password</label>
        <input id="confirm" name="confirm" type="password" minlength="6" required>

        <button class="btn" type="submit">Sign Up</button>

        <p class="muted">Already have an account? <a href="signin.html">Sign in</a></p>
      </form>
    </section>

    <script>
      // Simple client-side check for matching passwords
      document.querySelector('.auth-form').addEventListener('submit', function (e) {
        var pwd = document.getElementById('password').value;
        var conf = document.getElementById('confirm').value;
        if (pwd !== conf) {
          e.preventDefault();
          alert('Passwords do not match.');
        }
      });
    </script>
  </main>

  <footer class="site-footer">
    <div class="container">© MediTrack — Built for healthier routines</div>
  </footer>
</body>
</html>
