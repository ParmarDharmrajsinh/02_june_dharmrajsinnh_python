<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>MediTrack — Sign In</title>
  <link rel="stylesheet" href="style.css">
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600&display=swap" rel="stylesheet">
</head>
<body>
  <header class="site-header">
    <div class="container nav-container">
      <h1 class="brand">MediTrack</h1>
      <nav>
        <a href="index.html">Home</a>
        <a href="services.html">Services</a>
        <a href="about.html">About</a>
        <a href="contact">Contact</a>
        <a class="btn btn-signup" href="signup.html">Sign Up</a>
      </nav>
    </div>
  </header>

  <main>
    <section class="container auth-section">
      <form class="auth-form" action="#" method="post">
        <h2>Sign In</h2>
        <label for="email">Email</label>
        <input id="email" name="email" type="email" required>

        <label for="password">Password</label>
        <input id="password" name="password" type="password" required>

        <button class="btn" type="submit">Sign In</button>

        <p class="muted">Don't have an account? <a href="signup.html">Sign up</a></p>
      </form>
    </section>
  </main>

  <footer class="site-footer">
    <div class="container">© MediTrack — Built for healthier routines</div>
  </footer>
</body>
</html>
