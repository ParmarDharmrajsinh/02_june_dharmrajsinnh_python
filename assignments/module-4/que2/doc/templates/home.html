<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Doctor Profile</title>
  <style>
    /* Reset & Body */
    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background-color: #e30707;
      margin: 0;
      padding: 0;
    }

    /* Profile Card */
    .profile-card {
      width: 400px;
      background: #66fb7f;
      margin: 50px auto;
      padding: 30px;
      border-radius: 15px;
      box-shadow: 0 6px 15px rgba(0,0,0,0.1);
      text-align: center;
    }

    .profile-card img {
      width: 120px;
      height: 120px;
      border-radius: 50%;
      object-fit: cover;
      margin-bottom: 20px;
      border: 4px solid #06429c;
    }

    .profile-card h2 {
      color: #0d6efd;
      margin-bottom: 10px;
    }

    .profile-card p {
      color: #555;
      font-size: 16px;
      line-height: 1.5;
    }

    .contact-info {
      margin-top: 20px;
    }

    .contact-info p {
      margin: 5px 0;
    }
  </style>
</head>
<body>
  <div class="profile-card">

    <img src="/static/1img.jpg" alt="Doctor Photo">
    <p>Cardiologist | 1+ Years Experience</p>
    <div class="contact-info">
      <p>Email: dr.dhamo@example.com</p>
      <p>Phone: +91 8160408095</p>
    </div>
  </div>
</body>
</html>
