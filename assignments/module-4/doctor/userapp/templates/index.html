{% extends "base.html" %}

{% block title %}Home - Doctor Finder{% endblock %}

{% block content %}
<section class="bg-blue-50">
  <div class="max-w-7xl mx-auto px-4 py-20 flex flex-col md:flex-row items-center">
    <div class="md:w-1/2">
      <h1 class="text-4xl md:text-5xl font-bold text-gray-800 leading-tight">
        Find the Best <span class="text-blue-600">Doctors</span> Near You
      </h1>
      <p class="mt-4 text-lg text-gray-600">
        Search and connect with top medical professionals in your area. Easy, fast, and reliable.
      </p>
      <div class="mt-6 flex">
        <input type="text" placeholder="Search by doctor, specialty, or city"
          class="w-full md:w-96 px-4 py-3 rounded-l-lg border border-gray-300 focus:outline-none focus:ring-2 focus:ring-blue-500">
        <button class="bg-blue-600 text-white px-6 rounded-r-lg hover:bg-blue-700 transition">Search</button>
      </div>
    </div>
    <div class="md:w-1/2 mt-10 md:mt-0 flex justify-center">
      <img src="https://img.freepik.com/free-vector/doctor-character-background_1270-84.jpg" 
           alt="Doctor" class="w-96 rounded-xl shadow-lg">
    </div>
  </div>
</section>
{% endblock %}
