 {% extends "base.html" %}

{% block title %}Home - Doctor Finder{% endblock %}

{% block content %}
 <!-- Contact Section -->
  <section id="contact" class="max-w-6xl mx-auto px-4 py-20">
    <h2 class="text-3xl font-bold text-center text-gray-800">Contact Us</h2>
    <p class="text-center text-gray-600 mt-2">We’d love to hear from you. Reach out anytime!</p>
    <form class="mt-10 max-w-3xl mx-auto bg-white p-8 rounded-xl shadow space-y-4">
      <input type="text" placeholder="Your Name" class="w-full px-4 py-3 border rounded-lg focus:ring-2 focus:ring-blue-500">
      <input type="email" placeholder="Your Email" class="w-full px-4 py-3 border rounded-lg focus:ring-2 focus:ring-blue-500">
      <textarea placeholder="Your Message" rows="4" class="w-full px-4 py-3 border rounded-lg focus:ring-2 focus:ring-blue-500"></textarea>
      <button type="submit" class="bg-blue-600 text-white px-6 py-3 rounded-lg hover:bg-blue-700 transition">Send Message</button>
    </form>
  </section>
  {% endblock %}
