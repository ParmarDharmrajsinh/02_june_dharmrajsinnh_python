<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Doctor Finder | Login</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100 flex items-center justify-center min-h-screen">

  <div class="w-full max-w-md bg-white rounded-xl shadow-lg p-8">
    <!-- Logo / Title -->
    <div class="text-center mb-6">
      <h1 class="text-3xl font-bold text-blue-600">DoctorFinder</h1>
      <p class="text-gray-600 mt-2">Login to your account</p>
    </div>

    <!-- Login Form -->
    <form action="#" method="POST" class="space-y-5">
      {% csrf_token %}
      <!-- Email -->
      <div>
        <label for="email" class="block text-sm font-medium text-gray-700">Email Address</label>
        <input type="email" id="email" name="email" required
          class="w-full mt-2 px-4 py-3 border rounded-lg focus:ring-2 focus:ring-blue-500">
      </div>

      <!-- Password -->
      <div>
        <label for="password" class="block text-sm font-medium text-gray-700">Password</label>
        <input type="password" id="password" name="password" required
          class="w-full mt-2 px-4 py-3 border rounded-lg focus:ring-2 focus:ring-blue-500">
      </div>

      <!-- Remember Me + Forgot -->
      <div class="flex items-center justify-between">
        <label class="flex items-center text-sm text-gray-600">
          <input type="checkbox" class="mr-2 rounded border-gray-300"> Remember me
        </label>
        <a href="#" class="text-sm text-blue-600 hover:underline">Forgot password?</a>
      </div>

      <!-- Submit Button -->
      <button type="submit" 
        class="w-full bg-blue-600 text-white py-3 rounded-lg hover:bg-blue-700 transition">
        Login
      </button>
    </form>

    <!-- Divider -->
    <div class="flex items-center my-6">
      <div class="flex-grow h-px bg-gray-300"></div>
      <span class="px-2 text-sm text-gray-500">or</span>
      <div class="flex-grow h-px bg-gray-300"></div>
    </div>

    <!-- Social Login (Optional) -->
    <div class="flex space-x-4">
      <button class="flex-1 py-2 border rounded-lg hover:bg-gray-100">Google</button>
      <button class="flex-1 py-2 border rounded-lg hover:bg-gray-100">Facebook</button>
    </div>

    <!-- Signup Link -->
    <p class="text-center text-sm text-gray-600 mt-6">
      Don’t have an account? 
      <a href="/signup" class="text-blue-600 hover:underline">Sign up</a>
    </p>
  </div>

</body>
</html>
