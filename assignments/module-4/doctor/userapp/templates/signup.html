<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Sign Up - Doctor Finder</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-50 text-gray-800">

  <!-- Signup Section -->
  <div class="flex items-center justify-center min-h-screen bg-gray-50">
    <div class="w-full max-w-md bg-white p-8 rounded-xl shadow">
      <h2 class="text-2xl font-bold text-center text-gray-800">Create an Account</h2>
      
      <form method="post" class="mt-6 space-y-4">
        {% csrf_token %}
        <!-- Username -->
        <div>
          <label for="username" class="block text-sm font-medium text-gray-700">Username</label>
          <input type="text" id="username" name="username" required
            class="w-full mt-2 px-4 py-3 border rounded-lg focus:ring-2 focus:ring-blue-500">
        </div>

        <!-- Email -->
        <div>
          <label for="email" class="block text-sm font-medium text-gray-700">Email</label>
          <input type="email" id="email" name="email" required
            class="w-full mt-2 px-4 py-3 border rounded-lg focus:ring-2 focus:ring-blue-500">
        </div>

        <!-- Mobile Number -->
        <div>
          <label for="mobile" class="block text-sm font-medium text-gray-700">Mobile Number</label>
          <input type="tel" id="mobile" name="mobile" pattern="[0-9]{10}" maxlength="10" required
            class="w-full mt-2 px-4 py-3 border rounded-lg focus:ring-2 focus:ring-blue-500">
        </div>

        <!-- Password -->
        <div>
          <label for="password1" class="block text-sm font-medium text-gray-700">Password</label>
          <input type="password" id="password1" name="password" required
            class="w-full mt-2 px-4 py-3 border rounded-lg focus:ring-2 focus:ring-blue-500">
        </div>

        <!-- Submit -->
        <button type="submit"
          class="w-full bg-blue-600 text-white py-3 rounded-lg hover:bg-blue-700 transition">
          Sign Up
        </button>
      </form>

      <p class="mt-4 text-center text-gray-600">
        Already have an account?
        <a href="/login" class="text-blue-600 hover:underline">Login</a>
      </p>
    </div>
  </div>

</body>
</html>
