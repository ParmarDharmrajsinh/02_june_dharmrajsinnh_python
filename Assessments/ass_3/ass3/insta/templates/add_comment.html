
<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <title>Add Comment</title>
</head>
<body>
  <h1>Add Comment</h1>
  <form method="post">
    {% csrf_token %}
    <label for="content">Comment</label><br>
    <textarea name="content" id="content" rows="4" cols="50"></textarea><br>
    <button type="submit">Submit</button>
  </form>
  <p><a href="{% url 'insta:post_detail' post.id %}">Back to post</a></p>
</body>
</html>
